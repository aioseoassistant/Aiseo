name: home_calendar
description: A beautiful wall-mounted calendar display app that syncs with Google Calendar and iCloud
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9

  # Calendar & Date
  table_calendar: ^3.0.9
  intl: ^0.18.1

  # Native Calendar Integration
  device_calendar: ^4.5.1

  # State Management
  provider: ^6.1.1

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # HTTP & API
  http: ^1.1.2

  # Permissions
  permission_handler: ^11.1.0

  # Calendar Sync
  googleapis: ^11.4.0
  googleapis_auth: ^1.4.1
  url_launcher: ^6.2.2

  # Kiosk Mode (Android)
  flutter_screen_lock: ^9.0.1
  wakelock_plus: ^1.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  # Add assets
  assets:
    - assets/images/
    - assets/icons/

  # Add fonts if needed
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf
